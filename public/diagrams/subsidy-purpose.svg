<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" width="840" height="432" role="img"><title>01 / 補助宗旨資料閱讀示意</title><rect width="840" height="432" rx="18" fill="#F4F2E9"/><text x="32" y="48" font-size="18" font-weight="700" fill="#B47D60" font-family="sans-serif">01 / 補助宗旨</text><text x="32" y="93" font-size="32" font-weight="700" fill="#2D4939" font-family="sans-serif">拿到簡章後，先確認這四件事</text><path d="M32 112H808" stroke="#d9dfd6" stroke-width="2"/><rect x="32" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">辦理目的</text><text x="56" y="226" font-size="21" fill="#64786B" font-family="sans-serif">政府希望解決什麼問題</text><rect x="431" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">培力對象</text><text x="455" y="226" font-size="21" fill="#64786B" font-family="sans-serif">希望支持哪些人或組織</text><rect x="32" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">行動方式</text><text x="56" y="356" font-size="21" fill="#64786B" font-family="sans-serif">計畫怎麼回應目的</text><rect x="431" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">預期成果</text><text x="455" y="356" font-size="21" fill="#64786B" font-family="sans-serif">最後要產生什麼改變</text></svg>
