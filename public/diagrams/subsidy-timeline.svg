<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" width="840" height="432" role="img"><title>03 / 執行期程資料閱讀示意</title><rect width="840" height="432" rx="18" fill="#F4F2E9"/><text x="32" y="48" font-size="18" font-weight="700" fill="#B47D60" font-family="sans-serif">03 / 執行期程</text><text x="32" y="93" font-size="32" font-weight="700" fill="#2D4939" font-family="sans-serif">拿到簡章後，先確認這四件事</text><path d="M32 112H808" stroke="#d9dfd6" stroke-width="2"/><rect x="32" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">申請截止</text><text x="56" y="226" font-size="21" fill="#64786B" font-family="sans-serif">文件要在何時送達</text><rect x="431" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">審查與核定</text><text x="455" y="226" font-size="21" fill="#64786B" font-family="sans-serif">何時確認獲得支持</text><rect x="32" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">實際執行</text><text x="56" y="356" font-size="21" fill="#64786B" font-family="sans-serif">哪些日期可以支用經費</text><rect x="431" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">結案與撥款</text><text x="455" y="356" font-size="21" fill="#64786B" font-family="sans-serif">期中、期末與期款時點</text></svg>
