<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" width="840" height="432" role="img"><title>02 / 申請資格資料閱讀示意</title><rect width="840" height="432" rx="18" fill="#F4F2E9"/><text x="32" y="48" font-size="18" font-weight="700" fill="#B47D60" font-family="sans-serif">02 / 申請資格</text><text x="32" y="93" font-size="32" font-weight="700" fill="#2D4939" font-family="sans-serif">拿到簡章後，先確認這四件事</text><path d="M32 112H808" stroke="#d9dfd6" stroke-width="2"/><rect x="32" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">組織身分</text><text x="56" y="226" font-size="21" fill="#64786B" font-family="sans-serif">是否符合登記或立案要求</text><rect x="431" y="143" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="143" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="190" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">提案代表</text><text x="455" y="226" font-size="21" fill="#64786B" font-family="sans-serif">是否具備相應管理職務</text><rect x="32" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="32" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="56" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">工作經驗</text><text x="56" y="356" font-size="21" fill="#64786B" font-family="sans-serif">是否符合年資或能力要求</text><rect x="431" y="273" width="377" height="111" rx="12" fill="#fff" stroke="#d6dfd3" stroke-width="2"/><rect x="431" y="273" width="6" height="111" rx="3" fill="#B98163"/><text x="455" y="320" font-size="27" font-weight="700" fill="#2D4939" font-family="sans-serif">合作條件</text><text x="455" y="356" font-size="21" fill="#64786B" font-family="sans-serif">是否需要其他單位參與</text></svg>
