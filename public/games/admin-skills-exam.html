<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>行政技能小考試｜報到第一天：馬鞍社區協會｜製作者：石竣旻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 夜間辦公室：深藍框、米白對話框、金色任務標記；文件維持紙本 */
  --night:#151a2e;
  --frame:#232a4a;
  --frame-2:#2f3866;
  --cream:#f4efe1;
  --gold:#f5d22e;
  --ink:#1c2420;
  --paper:#fbfbf7;
  --rule:#c6d0c8;
  --blue:#24477a;
  --seal:#c4342c;
  --note:#f6e48c;
  --ok:#3fae68;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",var(--font-body);
  --font-pixel:"Press Start 2P",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#game{max-width:1040px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}

/* 像素框 */
.px{background:var(--frame);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--frame-2);border-radius:2px}
.pbtn{background:var(--frame-2);border:3px solid var(--cream);padding:6px 12px;font-weight:700;border-radius:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35)}
.pbtn:hover{background:var(--gold);color:var(--night)}
.pbtn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
.pbtn.gold{background:var(--gold);color:var(--night)}
.pbtn:disabled{opacity:.45;cursor:not-allowed;background:var(--frame-2);color:var(--cream)}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud .org{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;color:var(--gold)}
.hud .org b{font-family:var(--font-body);font-size:15px;color:var(--cream);margin-left:8px;letter-spacing:.1em}
.hud .btns{display:flex;gap:8px;align-items:center}
.hud .stars{font-family:var(--font-pixel);font-size:11px;color:var(--gold)}
.goal{display:flex;gap:10px;align-items:center;padding:6px 12px;font-size:15px;background:#10142a;border:2px solid var(--frame-2)}
.goal .tag{font-family:var(--font-pixel);font-size:9px;color:var(--night);background:var(--gold);padding:4px 6px;flex:none}

/* 畫面 */
#stageWrap{position:relative;align-self:center;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
#dialog{position:absolute;left:8px;right:8px;bottom:8px;line-height:1.6;padding:12px 16px 14px;min-height:92px;cursor:pointer;user-select:none}
#dialog .name{position:absolute;top:-16px;left:12px;background:var(--gold);color:var(--night);font-weight:900;font-size:14px;padding:1px 10px;border:3px solid var(--night)}
#dialog .text{font-size:17px;font-weight:500;padding-top:6px;min-height:2.6em}
#dialog .more{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* 手機操作 */
#pad{display:none;justify-content:space-between;align-items:center;padding:4px 8px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
.dpad button,.abtn{touch-action:none;background:var(--frame-2);border:3px solid var(--cream);border-radius:0;font-size:20px;font-weight:900;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35)}
.dpad button.on,.abtn.on{background:var(--gold);color:var(--night)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.abtn{width:76px;height:76px;border-radius:50%;font-family:var(--font-pixel);font-size:18px}
.keys{font-size:13px;color:#a9b0cc;margin:0;text-align:center}
.keys kbd{font-family:var(--font-pixel);font-size:9px;border:2px solid #a9b0cc;padding:2px 4px;margin:0 2px}
@media (pointer:coarse),(max-width:760px){#pad{display:flex}.keys.desk{display:none}}
@media (pointer:fine) and (min-width:761px){.keys.touch{display:none}}

/* 面板 */
#panel{position:fixed;inset:0;background:rgba(10,12,24,.82);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 14px;z-index:5}
#panel[hidden]{display:none}
.pin{width:100%;max-width:980px;padding:18px;line-height:1.7;margin:auto 0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.phead h2{margin:0;font-size:20px;font-weight:900}
.phead .lvno{font-family:var(--font-pixel);font-size:10px;color:var(--gold);display:block;margin-bottom:4px}
.stage{display:grid;gap:16px}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px}

.doc{background:var(--paper);color:var(--ink);padding:16px;border-radius:2px}
.doc h3{font-size:17px;text-align:center;letter-spacing:.2em;border-bottom:3px double var(--ink);padding-bottom:6px;margin:0 0 10px}
.doc .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#5a665f;margin-bottom:8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #9fb0a5;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef2ec;font-weight:500;white-space:nowrap}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .remark{font-size:13px;margin-top:8px;color:#5a665f}

.qbox{position:relative;background:#10142a;border:3px solid var(--frame-2);padding:16px}
.progress{display:flex;gap:6px;margin-bottom:12px}
.progress i{flex:1;height:6px;background:#3a4270}
.progress i.on{background:var(--gold)}
.q{font-size:18px;font-weight:700;margin:0 0 14px;padding-right:70px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--frame-2);border:3px solid #6670a8;padding:10px 14px;border-radius:0}
.opt::before{content:"▶ ";color:transparent}
.opt:not(:disabled):hover{border-color:var(--gold)}
.opt:not(:disabled):hover::before{color:var(--gold)}
.opt.wrong{border-color:var(--seal);color:#e99b95;text-decoration:line-through}
.opt.right{border-color:var(--ok);background:#1f4a33;font-weight:700}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow label{width:100%;font-size:13px;color:#a9b0cc}
.numrow input{font:inherit;font-size:20px;width:180px;padding:8px 12px;border:3px solid var(--cream);background:var(--paper);color:var(--ink);border-radius:0;font-variant-numeric:tabular-nums}

.sticky{background:var(--note);color:#3a3216;font-family:var(--font-hand);font-size:17px;line-height:1.65;padding:12px 16px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.4);transform:rotate(-.6deg)}
.sticky .sig{text-align:right;font-size:14px;opacity:.75}
.good{background:#1f4a33;border-left:6px solid var(--ok);padding:10px 14px}
.good b{color:#9be3b5}
.gain{font-size:14px;color:var(--gold);font-weight:700}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{border:2px dashed #8f99d6;padding:8px 12px;background:#1a2045;font-size:15px}
.hint .lv{font-size:12px;font-weight:700;color:#b9c2f2;letter-spacing:.08em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fine{font-size:13px;color:#a9b0cc}

.stamp{position:absolute;right:12px;top:10px;width:62px;height:62px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);font-weight:900;font-size:26px;display:grid;place-items:center;transform:rotate(-14deg);pointer-events:none;background:rgba(255,255,255,.04)}
.stamp.no{border-radius:4px;font-size:19px;width:62px;height:42px;color:#7fa3e0;border-color:#7fa3e0;top:14px}
.stamp.anim{animation:press .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes press{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.anim,#dialog .more{animation:none}}

.center{text-align:center}
.bigstars{font-size:40px;letter-spacing:6px;color:var(--gold)}
.stars-s{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.off{color:#4a5288}
.notelist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.notelist li{border-left:6px solid var(--note);background:#1a2045;padding:10px 14px}
.notelist li b{display:block;color:var(--note)}
.notelist li.locked{border-left-color:#4a5288;color:#8088b8}
.notelist li.locked b{color:#8088b8}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#10142a;border:3px solid var(--frame-2);padding:10px 12px}
.qrow .no{font-family:var(--font-pixel);font-size:11px;color:var(--gold)}
.qrow .d{font-size:13px;color:#a9b0cc}
.badge{display:inline-block;font-weight:900;font-size:26px;color:var(--seal);background:var(--paper);border:4px solid var(--seal);padding:4px 18px;transform:rotate(-3deg)}
.title-screen{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:20px 8px}
.title-screen .k{font-family:var(--font-pixel);font-size:11px;color:var(--gold);letter-spacing:.1em}
.title-screen h1{font-size:clamp(38px,9vw,60px);font-weight:900;margin:0;letter-spacing:.08em;text-shadow:4px 4px 0 var(--seal)}
.title-screen p{max-width:32em;margin:0}
.rolechip{font-size:13px;font-weight:700;background:var(--cream);color:var(--night);padding:2px 10px;border:3px solid var(--gold)}
.rtag{display:inline-block;font-size:13px;background:var(--gold);color:var(--night);padding:0 8px;margin-right:8px;vertical-align:2px}
.grouph{margin:10px 0 8px;font-size:16px;color:var(--gold)}
.lvno{font-family:var(--font-pixel);font-size:10px;color:var(--gold);display:block;margin-bottom:4px}
footer{max-width:992px;margin:0 auto;padding:0 16px 28px;font-size:12px;color:#8088b8;text-align:center}
footer a{color:#b9c2f2}

/* ===== 午後陽光：暖色、金框、襯線字 ===== */
:root{--night:#140e09;--frame:#1f160d;--frame-2:#3b2a16;--cream:#f6ead0;--gold:#d9b46a;--font-pixel:"Cinzel",serif;--font-serif:"Noto Serif TC","Songti TC",serif}
body{background:radial-gradient(ellipse 90% 60% at 50% 0%,#2e2014 0%,#120c07 70%);color:var(--cream)}
.px{background:var(--frame);border:2px solid #c9a45c;box-shadow:inset 0 0 0 4px var(--frame),inset 0 0 0 5px rgba(201,164,92,.45),0 12px 28px rgba(0,0,0,.45);border-radius:0}
.pbtn{background:#2a1d10;border:2px solid #c9a45c;box-shadow:none;font-family:var(--font-serif);border-radius:0}
.pbtn:hover{background:#c9a45c;color:#1c130a}
.pbtn:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.pbtn.gold{background:#c9a45c;color:#1c130a;border-color:#fff1c9}
.pbtn:disabled{background:#2a1d10;color:var(--cream)}
.hud .org{font-family:var(--font-pixel);font-size:12px;letter-spacing:.22em;color:#c9a45c}
.hud .org b{font-family:var(--font-serif);font-size:17px;font-weight:900}
.hud .stars{font-family:var(--font-pixel);font-size:14px;color:#f0d79a}
.rolechip{background:#f3e6c4;color:#3b2a12;border:2px solid #8a6a2c;font-family:var(--font-serif);font-weight:900}
.goal{background:rgba(28,19,10,.85);border:1px solid #8a6a2c;font-family:var(--font-serif)}
.goal .tag{font-family:var(--font-pixel);font-size:11px;letter-spacing:.14em;background:#c9a45c;color:#1c130a}

#stageWrap{padding:0;line-height:normal}
#scene{position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 25%,#3d2a18 0%,#160e08 78%);perspective-origin:50% 16%;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#plane{position:absolute;left:0;top:0;width:1280px;height:832px;transform-origin:0 0;transform-style:preserve-3d;--inv:1}
#plane img{image-rendering:pixelated;display:block;-webkit-user-drag:none}
#plane .floor,#plane .wall,#plane .hit,#plane .bb,#plane .shadow{position:absolute}
#plane .wall{transform-origin:50% 100%;transform:rotateX(-90deg)}
#plane .hit{width:64px;height:64px}
#plane .bb{transform-origin:50% 100%}
#plane .char{width:60px;height:108px;transform-style:preserve-3d}
#plane .char .spr{width:60px;height:108px}
#plane .shadow{width:48px;height:16px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,18,4,.6),rgba(40,18,4,0) 70%);pointer-events:none}
.ntagw{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-2px);display:flex;flex-direction:column;align-items:center;pointer-events:none;font-size:calc(15px * var(--inv))}
.ntag{background:#f3e6c4;color:#3b2a12;border:.13em solid #8a6a2c;box-shadow:0 0 0 .13em #f3e6c4,0 .2em .5em rgba(0,0,0,.45);padding:0 .6em;font:700 1em/1.5 var(--font-serif);white-space:nowrap}
.ntagpt{width:.5em;height:.5em;background:#8a6a2c;transform:rotate(45deg);margin-top:-.2em}
.ntagw.me .ntag{background:#c9a45c;color:#24170a;border-color:#fff1c9;box-shadow:0 0 0 .13em #6b4d1c,0 0 .9em rgba(255,214,140,.85);font-weight:900}
.ntagw.me .ntagpt{background:#fff1c9}
.nmark{width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;margin-bottom:.35em;background:#f0d79a;color:#24170a;border:.13em solid #fff1c9;font:900 1.1em/1 var(--font-pixel);box-shadow:0 0 1em rgba(255,214,140,.95);animation:markbob 1.1s ease-in-out infinite}
@keyframes markbob{50%{transform:translateY(-.3em)}}
.fx{position:absolute;inset:0;pointer-events:none}
.grade{background:linear-gradient(160deg,rgba(255,200,120,.5) 0%,rgba(255,150,70,.16) 50%,rgba(90,45,100,.3) 100%);mix-blend-mode:soft-light}
.beams i{position:absolute;top:-8%;width:7%;height:92%;transform-origin:50% 0;transform:rotate(-24deg);background:linear-gradient(180deg,rgba(255,238,196,.62),rgba(255,214,150,.16) 60%,rgba(255,214,150,0));filter:blur(12px);mix-blend-mode:screen}
.dust b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3d1;box-shadow:0 0 6px 2px rgba(255,228,170,.8);animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(14px,-18px);opacity:.9}}
.vig{background:radial-gradient(ellipse 78% 74% at 50% 45%,rgba(0,0,0,0) 55%,rgba(38,20,6,.62) 100%)}
.dof{backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
.dof.top{bottom:auto;height:22%;-webkit-mask-image:linear-gradient(#000,rgba(0,0,0,0));mask-image:linear-gradient(#000,rgba(0,0,0,0))}
.dof.bot{top:auto;height:14%;-webkit-mask-image:linear-gradient(rgba(0,0,0,0),#000);mask-image:linear-gradient(rgba(0,0,0,0),#000)}
@media (prefers-reduced-motion:reduce){.dust b,.nmark{animation:none}}

#dialog{background:linear-gradient(180deg,rgba(30,21,12,.93),rgba(16,11,6,.96));border:2px solid #c9a45c;box-shadow:inset 0 0 0 4px rgba(16,11,6,.9),inset 0 0 0 5px rgba(201,164,92,.45),0 14px 30px rgba(0,0,0,.5);border-radius:0;left:4%;right:4%;bottom:14px;padding:18px 26px 16px}
#dialog .name{background:#c9a45c;color:#24170a;border:2px solid #fff1c9;font-family:var(--font-serif);font-size:15px;letter-spacing:.08em;top:-17px;left:22px;padding:1px 16px}
#dialog .text{font-family:var(--font-serif);font-size:19px;font-weight:600;color:#f6ead0}
#dialog .more{color:#f0d79a}

.dpad button,.abtn{background:#2a1d10;border:2px solid #c9a45c;color:#f0d79a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dpad button{border-radius:6px}
.dpad button.on,.abtn.on{background:#c9a45c;color:#1c130a}
.abtn{font-family:var(--font-pixel);font-size:22px}
.keys{color:#c9b896}
.keys kbd{font-family:var(--font-pixel);font-size:10px;border-color:#8a6a2c;color:#f0d79a}

#panel{background:rgba(12,8,4,.84)}
.phead h2,.title-screen h1,.q,.pin h3,.qrow b,.notelist li b{font-family:var(--font-serif)}
.phead .lvno,.lvno{font-family:var(--font-pixel);font-size:11px;letter-spacing:.18em;color:#c9a45c}
.title-screen .k{font-family:var(--font-pixel);font-size:12px;letter-spacing:.24em;color:#c9a45c}
.title-screen h1{text-shadow:0 0 24px rgba(255,200,120,.45),3px 3px 0 #6b4d1c;font-weight:900}
.qbox{background:#1a120a;border:2px solid #5a4630}
.progress i{background:#4a3a22}
.progress i.on{background:#d9b46a}
.opt{background:#2a1d10;border:2px solid #6b5228;font-family:var(--font-serif)}
.opt:not(:disabled):hover{border-color:#e2c98e}
.opt:not(:disabled):hover::before{color:#e2c98e}
.hint{background:#241a0f;border:2px dashed #a8874a}
.hint .lv{color:#e2c98e}
.numrow label,.fine{color:#c9b896}
.numrow input{border-color:#c9a45c}
.notelist li{background:#241a0f}
.notelist li b{color:#f0d79a}
.notelist li.locked{border-left-color:#5a4630;color:#9c8a68}
.notelist li.locked b{color:#9c8a68}
.qrow{background:#1a120a;border:2px solid #3b2a16}
.qrow .no{font-family:var(--font-pixel);color:#c9a45c}
.qrow .d{color:#c9b896}
.off{color:#5a4630}
.grouph{color:#e2c98e;font-family:var(--font-serif)}
.rtag{background:#c9a45c;color:#1c130a}
.gain{color:#f0d79a}
.bigstars,.stars-s{color:#f0c96a}
footer{color:#9c8a68}
footer a{color:#e2c98e}

/* ===== 對話式作答、計算機、小抄、表情 ===== */
.qd{position:absolute;left:3%;right:3%;bottom:12px;max-height:82%;overflow:auto;z-index:3;padding:14px 20px 16px;line-height:1.6;overscroll-behavior:contain}
@media (pointer:coarse),(max-width:760px){.qd{position:fixed;left:8px;right:8px;bottom:8px;max-height:70vh;z-index:4;padding:12px 14px 14px}}
body.questing #pad{visibility:hidden}
.qd-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-pixel);font-size:11px;letter-spacing:.1em;color:#c9a45c}
.qd-x{background:none;border:1px solid #8a6a2c;color:#e2c98e;font:500 13px var(--font-serif);padding:3px 12px;cursor:pointer;flex:none}
.qd-x:hover{background:#3b2a16}
.qd .progress{margin:8px 0 10px}
.qd-name{display:inline-block;background:#c9a45c;color:#24170a;border:2px solid #fff1c9;font:900 15px var(--font-serif);padding:1px 14px;letter-spacing:.06em}
.qd-q{font:700 19px/1.6 var(--font-serif);margin:8px 0 12px;color:#f6ead0}
.qd-opts{display:grid;gap:8px}
@media (min-width:900px){.qd-opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qd-num{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qd-num label{width:100%;font-size:13px;color:#c9b896}
.qd-num input{font:inherit;font-size:20px;width:170px;padding:6px 10px;border:2px solid #c9a45c;background:#fbfbf7;color:#1c2420;border-radius:0;font-variant-numeric:tabular-nums}
.qd-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.qd .sticky,.qd .good,.qd .hints,.qd .gain{margin-top:10px}
.qd-next{display:flex;justify-content:flex-end;margin-top:10px}
.qd .stamp{top:36px;right:18px}
.calc{margin-top:10px;background:#120c07;border:2px solid #5a4630;padding:10px;max-width:340px}
.calc-d{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;background:#e7eed5;color:#1d2a14;font:600 17px/1.4 var(--font-body);font-variant-numeric:tabular-nums;padding:6px 10px;min-height:38px;box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.calc-r{font-weight:900;font-size:19px}
.calc-k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc-k button{min-height:44px;background:#2a1d10;border:1px solid #8a6a2c;color:#f6ead0;font:700 17px var(--font-body);border-radius:4px;cursor:pointer}
.calc-k button:hover{border-color:#f0d79a}
.calc-k button:active{background:#3b2a16}
.calc-k .op{color:#f0d79a}
.calc-k .pct{grid-column:span 2;background:#5a4220;color:#fff1c9}
.calc-fill{width:100%;margin-top:8px}
.chip{font:inherit;background:#fff3c4;border:1px dashed #b8962e;color:#3b2a12;padding:0 3px;border-radius:3px;cursor:pointer}
.chip:hover,.chip:focus-visible{background:#f6e48c}
.nemo{display:none}
.nemo.show{display:grid;place-items:center;min-width:1.8em;height:1.8em;padding:0 .35em;margin-bottom:.3em;background:#fffaf0;color:#3b2a12;border:.13em solid #3b2a12;border-radius:1em;font:900 1.1em/1 var(--font-serif);box-shadow:0 .2em .4em rgba(0,0,0,.35);animation:pop .25s ease-out}
.nemo.happy{background:#fff1c9;color:#b25a00}
.nemo.worry{background:#e8eef8;color:#2f4a7a}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#plane .char.hop .spr{animation:hop .55s ease-out}
#plane .char.shake .spr{animation:shake .45s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}78%{transform:translateY(-5px)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
#plane .ring{position:absolute;width:52px;height:52px;margin:6px;border-radius:50%;border:4px solid #f0d79a;box-shadow:0 0 18px rgba(255,214,140,.9),inset 0 0 14px rgba(255,214,140,.7);pointer-events:none;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(.8);opacity:.6}}
@media (prefers-reduced-motion:reduce){.nemo.show,#plane .char.hop .spr,#plane .char.shake .spr,#plane .ring{animation:none}}
.goal .skip{margin-left:auto;font-size:13px;padding:2px 10px;flex:none}
.wb{background:#f7f8f5;color:#1c2420;padding:16px;border:6px solid #b8c0c8;box-shadow:inset 0 0 0 2px #dfe4e8}
.wb h3{font-family:var(--font-serif);margin:0 0 8px;color:#1f4a8a;font-size:19px}
.wb-k{font-weight:700;color:#b0302a;margin:14px 0 6px}
.wb-f{font:700 17px/1.6 var(--font-serif);background:#fffbe8;border:1px dashed #b8962e;padding:8px 12px}
.wb-f span{font:400 13px var(--font-body);color:#5a665f}
.wb-n{margin:14px 0 0;font-size:14px;color:#3b4a44}
.wb th{background:#e6ecf2}
.gloss{display:grid;gap:8px}
@media (min-width:900px){.gloss{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gloss details{background:#241a0f;border:2px solid #3b2a16;padding:8px 14px}
.gloss summary{cursor:pointer;font:700 16px var(--font-serif);color:#f0d79a}
.gloss details.seen summary::after{content:"　查過";font:500 12px var(--font-body);color:#9be3b5}
.gloss p{margin:8px 0 2px}
.samples{display:grid;gap:14px}
@media (min-width:900px){.samples{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sample .stitle{font:700 12px var(--font-body);color:#8a6a2c;margin-bottom:6px}
.doc td.hl{background:#fff1b8;box-shadow:inset 0 -2px 0 #e1b23a}
.doc sup{color:#b0302a;font-weight:900;margin-left:2px}
.callouts{margin:10px 0 0;padding-left:1.4em;font-size:13px;color:#3b4a44}

/* ===== 可互動提示 ===== */
#olayer{position:absolute;inset:0;pointer-events:none;z-index:1}
#olayer .olabel{position:absolute;left:0;top:0;font-size:14px;pointer-events:none;will-change:transform}
#plane .oanchor{position:absolute;width:2px;height:2px;pointer-events:none}
.near[hidden]{display:none}
#olayer .opill{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:.35em;padding:.15em .7em .15em .45em;background:#1f5c5a;color:#f4fbf6;border:.13em solid #9fe0cf;border-radius:1em;font:700 1em/1.45 var(--font-serif);white-space:nowrap;box-shadow:0 0 0 .13em #0f3332,0 .25em .6em rgba(0,0,0,.45);animation:obob 2.4s ease-in-out infinite}
#olayer .opill svg{width:1.05em;height:1.05em;flex:none}
#olayer .olabel.is-near .opill{background:#2b8a78;border-color:#fff3c4;box-shadow:0 0 0 .13em #0f3332,0 0 1.1em rgba(160,240,215,.95);transform:scale(1.12)}
@keyframes obob{50%{transform:translateY(-.25em)}}
.near{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;background:rgba(20,14,8,.9);border:2px solid #9fe0cf;border-radius:999px;color:#f4fbf6;font:700 15px var(--font-serif);white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.45);pointer-events:none}
.near-k{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#9fe0cf;color:#0f3332;font:900 14px var(--font-pixel)}
@media (pointer:coarse),(max-width:760px){.near{bottom:8px;font-size:14px}#olayer .olabel{font-size:12px}}
@media (prefers-reduced-motion:reduce){#olayer .opill{animation:none}}
.abtn.ready{box-shadow:0 0 0 3px #9fe0cf,0 0 16px rgba(160,240,215,.9)}

#olayer .olabel:not(.open) .otext{display:none}
#olayer .olabel:not(.open) .opill{padding:.32em;gap:0;opacity:.92;animation:obob 2.4s ease-in-out infinite,glint 3s ease-in-out infinite}
#olayer .olabel:not(.open) .opill svg{width:.95em;height:.95em}
#olayer .olabel:not(.open) .opill:hover{opacity:1}
@keyframes glint{0%,70%,100%{box-shadow:0 0 0 .13em #0f3332,0 .2em .5em rgba(0,0,0,.45)}82%{box-shadow:0 0 0 .13em #0f3332,0 0 .9em .2em rgba(160,240,215,.9)}}
@media (prefers-reduced-motion:reduce){#olayer .olabel:not(.open) .opill{animation:none}}

.qbox .calc{max-width:none;margin-top:14px}
.qbox .qd-name{margin-bottom:6px}
.chip.used{background:#c8f0de;border-color:#2b8a78}

/* ===== v8：全螢幕版面、疊加標題列、矮對話框、浮動 A 鍵 ===== */
html,body{height:100%;overflow:hidden}
body{overscroll-behavior:none}
#game{position:fixed;inset:0;max-width:none;margin:0;padding:0;display:block}
#stageWrap{position:absolute;inset:0;width:auto!important;height:auto;padding:0;align-self:stretch;justify-self:stretch}
#scene{width:100%!important;height:100%!important}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"who goal btns";align-items:start;gap:8px 12px;padding:12px 14px 26px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none;background:linear-gradient(rgba(14,9,5,.78),rgba(14,9,5,.45) 60%,rgba(14,9,5,0))}
#hud>*{pointer-events:auto}
.hud-who{grid-area:who;display:flex;gap:8px;align-items:center;height:40px}
.hud-who .stars{display:inline-block;background:rgba(31,22,13,.88);border:2px solid #8a6a2c;padding:3px 10px;font-size:14px;line-height:1.4;white-space:nowrap}
.hud-who .stars.pop{animation:spop .35s ease-out}
@keyframes spop{40%{transform:scale(1.3);background:#c9a45c;color:#1c130a}}
#hud .goal{grid-area:goal;justify-self:start;max-width:620px;font-size:14px;line-height:1.5;padding:5px 10px;min-height:40px}
.hud-r{grid-area:btns;display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 12px;background:rgba(31,22,13,.9);border:2px solid #c9a45c;color:#f0d79a;font:700 14px var(--font-serif);border-radius:0;cursor:pointer}
.ibtn:hover{background:#c9a45c;color:#1c130a}
.ibtn svg{width:20px;height:20px;flex:none}
.ibtn.muted{color:#9c8a68;border-color:#6b5228}
#btnSound,#btnSet{padding:0;width:40px}
@media (max-width:860px){
  #hud{grid-template-columns:auto 1fr;grid-template-areas:"who btns" "goal goal";padding:10px 10px 22px;padding-top:max(10px,env(safe-area-inset-top))}
  .hud-r{justify-self:end}
  .ibtn{padding:0;width:40px}
  .ibtn .ib-t{display:none}
  #hud .goal{max-width:none;width:100%;font-size:13px;padding:4px 8px;min-height:0}
  .hud-who .rolechip{font-size:12px;padding:1px 8px}
  .hud-who .stars{font-size:13px;padding:2px 8px}
}

/* 對話框：矮、左側大頭貼 */
#dialog{left:50%;right:auto;transform:translateX(-50%);width:min(780px,calc(100% - 24px));bottom:max(16px,env(safe-area-inset-bottom));min-height:0;display:flex;gap:14px;align-items:flex-start;padding:12px 18px 12px 12px;z-index:4}
#dialog .name{position:static;display:inline-block;border:0;padding:0 10px;font-size:14px;margin-bottom:2px}
#dialog .dbody{flex:1;min-width:0}
#dialog .text{font-size:17px;line-height:1.6;padding-top:2px;min-height:3.2em}
#dialog .more{right:12px;bottom:6px}
.dport{position:relative;flex:none;width:76px;height:76px;background:linear-gradient(180deg,#f3e6c4,#e2cf9f);border:2px solid #c9a45c;box-shadow:inset 0 0 0 2px #fff1c9;overflow:hidden}
.dport[hidden]{display:none}
.dport-img{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated;background-size:96px 172px;background-position:-12px -2px}
.dport.say .dport-img{animation:dtalk .3s ease-out}
@keyframes dtalk{40%{transform:translateY(-3px)}}
.dport-emo{position:absolute;right:2px;top:2px;min-width:22px;height:22px;padding:0 4px;display:none;place-items:center;border-radius:11px;background:#fffaf0;color:#3b2a12;border:2px solid #3b2a12;font:900 13px/1 var(--font-serif)}
.dport-emo.on{display:grid;animation:pop .25s ease-out}
.dport-emo.happy{background:#fff1c9;color:#b25a00}
.dport-emo.worry{background:#e8eef8;color:#2f4a7a}
@media (max-width:760px){
  #dialog{width:calc(100% - 16px);bottom:max(10px,env(safe-area-inset-bottom));gap:10px;padding:10px 14px 10px 10px}
  .dport{width:60px;height:60px}
  .dport-img{background-size:76px 136px;background-position:-9px -2px}
  #dialog .text{font-size:16px;min-height:3.2em}
}

#dialog[hidden],.abtn[hidden],#hud[hidden]{display:none!important}
.dof.top{height:9%}
.nmark{background:#ffd76a;color:#2a1a06;border-color:#fff8dc;box-shadow:0 0 0 .12em #6b4d1c,0 0 1.2em rgba(255,200,90,1)}
/* 浮動 A 鍵與可點的提示 */
#pad,.keys.touch{display:none!important}
.abtn{position:absolute;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;width:66px;height:66px;display:none;place-items:center;border-radius:50%;opacity:.88}
.abtn.ready{opacity:1}
@media (pointer:coarse),(max-width:760px){.abtn{display:grid}}
body.talking .abtn,body.questing .abtn{display:none}
.near{pointer-events:auto;cursor:pointer;bottom:20px}
.near:hover{border-color:#fff3c4}
@media (pointer:coarse),(max-width:760px){
  .near{left:12px;right:96px;transform:none;bottom:max(28px,calc(env(safe-area-inset-bottom) + 10px));white-space:normal;justify-content:flex-start;padding:6px 14px 6px 6px;border-radius:24px;font-size:14px;width:max-content;max-width:calc(100% - 108px)}
}
#keyHint{position:absolute;left:14px;bottom:12px;z-index:2;margin:0;padding:4px 10px;background:rgba(20,14,8,.72);font-size:12px;pointer-events:none}
body.talking #keyHint{display:none}
@media (pointer:coarse),(max-width:760px){#keyHint{display:none}}
@media (max-width:1100px){#keyHint{display:none}}

/* 名牌：遠處收起、相鄰錯開 */
.ntagw .ntag,.ntagw .ntagpt{transition:opacity .2s}
.ntagw.far .ntag,.ntagw.far .ntagpt{opacity:0}
.ntagw.lift{transform:translate(-50%,calc(-2px - 1.75em))}
.nmark{width:2em;height:2em;font-size:1.2em}

/* 畫面邊緣的「！」 */
.edge{position:absolute;left:0;top:0;z-index:2;width:34px;height:34px;margin:-17px 0 0 -17px;display:grid;place-items:center;border-radius:50%;background:#f0d79a;color:#24170a;border:2px solid #fff1c9;font:900 17px/1 var(--font-pixel);box-shadow:0 0 14px rgba(255,214,140,.9);pointer-events:none}
.edge i{position:absolute;left:50%;top:50%;width:0;height:0;border:7px solid transparent;border-left:10px solid #f0d79a;margin:-7px 0 0 15px;transform-origin:-15px 7px}
.edge[hidden]{display:none}

/* 小抄：手機卡片 */
@media (max-width:640px){
  .wb .tbl-wrap{overflow:visible}
  .wb table,.wb tbody,.wb tr,.wb td{display:block;width:100%}
  .wb tr:first-child{display:none}
  .wb tr{background:#fff;border:1px solid #c6d0c8;border-left:5px solid #1f4a8a;padding:8px 12px 10px;margin-bottom:10px}
  .wb td{border:0;padding:2px 0}
  .wb td:first-child{font:700 17px/1.5 var(--font-serif);color:#1f4a8a;border-bottom:1px dashed #c6d0c8;padding-bottom:4px;margin-bottom:4px}
  .wb td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:#6b7a72;letter-spacing:.06em;margin-top:4px}
}

/* 設定 */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:#1a120a;border:2px solid #5a4630;padding:12px 14px;color:var(--cream)}
.setrow:hover{border-color:#c9a45c}
.setrow b{display:block;font:700 17px var(--font-serif);color:#f0d79a}
.setrow .d{font-size:13px;color:#c9b896}
.sw{flex:none;position:relative;width:52px;height:28px;border-radius:14px;background:#3b2a16;border:2px solid #8a6a2c}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#9c8a68;transition:transform .15s}
.sw.on{background:#2b8a78;border-color:#9fe0cf}
.sw.on::after{transform:translateX(24px);background:#fff3c4}
.about{font-size:13px;color:#c9b896}
.about a{color:#e2c98e}
.title-screen .about{max-width:34em;margin-top:6px}

/* 過關：核可章、星星 */
.clearwrap{position:relative}
.clearstamp{position:absolute;right:4px;top:-4px;padding:6px 14px;border:4px double var(--seal);color:var(--seal);background:rgba(255,240,230,.08);font:900 30px/1 var(--font-serif);letter-spacing:.2em;transform:rotate(-12deg);pointer-events:none;animation:slam .45s cubic-bezier(.2,1.5,.35,1) .15s both}
@keyframes slam{from{transform:rotate(-12deg) scale(2.6);opacity:0}60%{opacity:1}to{transform:rotate(-12deg) scale(1);opacity:1}}
.pin.shake{animation:pshake .3s .45s}
@keyframes pshake{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,1px)}}
.bigstars .stars-s>*,.bigstars .stars-s{display:inline-block}
.bigstars .s1{display:inline-block;animation:starin .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:9}
.flystar{position:absolute;left:0;top:0;font-size:34px;color:#f0c96a;text-shadow:0 0 12px rgba(255,214,140,.9);line-height:1}
@media (max-width:760px){.clearstamp{font-size:22px;padding:4px 10px}}
@media (prefers-reduced-motion:reduce){.clearstamp,.pin.shake,.bigstars .s1,.dport.say .dport-img,.dport-emo.on{animation:none}}

#tpop{position:fixed;z-index:8;width:min(340px,calc(100vw - 16px));background:#fffaf0;color:#2a1d10;border:2px solid #8a6a2c;box-shadow:0 10px 28px rgba(0,0,0,.5);padding:12px 14px 10px;line-height:1.65}

<script>

const fee = n => Math.round(n * CFG.rate);
const fmt = n => Number(n).toLocaleString('zh-TW');
const GUIDE = '/local-practice-guide/entries/supplemental-premium/';

/* ===== 前輩筆記本 ===== */
const NOTES = {
  'n-9a':      { t: '50、9A、9B 怎麼分', d: '9A：獨立以專業勞務取得、自負成本與盈虧，例如表演者。9B：專題講演、稿費、著作、翻譯、版稅。50：受單位指揮監督的薪資。不能只看名稱或合約怎麼寫。' },

  'n-50':      { t: '正式課程鐘點費通常是 50', d: '單位排課、提供場地教材、按鐘點計酬的課程，通常是薪資所得（50）。名稱叫「講座」也一樣。' },

  'n-emp':     { t: '協會自己也可能要繳', d: '代碼 50、79A、79B 的薪資所得會計入單位當月薪資總額。超過員工投保金額總額的差額 × 2.11%，由單位自行負擔，不能從個人報酬扣。' },

  {

  {

    doc: () => `

function wrong(msg) {
  S.mistakes++; S.ss.fb = msg; S.ss.stamp = 'no'; S.ss.anim = true;
  renderPanel(curL().steps[S.st].type === 'number' ? 'numIn' : null);
}
function right() {
  const step = curL().steps[S.st];
  S.ss.done = true; S.ss.fb = null; S.ss.stamp = 'ok'; S.ss.anim = true;
  if (step.note && !S.notes.includes(step.note)) { S.notes.push(step.note); save(); }
  renderPanel();
}
function submitNum(raw) {
  const step = curL().steps[S.st];
  S.ss.input = raw;
  const v = parseInt(String(raw).replace(/[,，\s元]/g, ''), 10);
  if (Number.isNaN(v)) { S.ss.fb = '請輸入數字，例如 1234。'; S.ss.stamp = null; renderPanel('numIn'); return; }
  if (v === step.answer) { S.ss.input = fmt(v); right(); return; }
  wrong(step.errors[v] || step.fallback);
}
function nextStep() {
  const L = curL();
  const firstTime = !S.prog[L.id];
  const before = S.prog[L.id] || 0;
  S.lastStars = starsFor(S.mistakes, S.maxHint);
  starHold = Math.max(0, S.lastStars - before);
  S.prog[L.id] = Math.max(S.prog[L.id] || 0, S.lastStars);
  S.inTask = null; save(); updateHud();
  const tk = { ...TALK[L.id], thanks: LTHANKS[L.id] ? [...TALK[L.id].thanks, LTHANKS[L.id]] : TALK[L.id].thanks };
  if (S.tRole === 'finale') {
    afterClose = () => say(tk.thanks, () => { if (!S.notes.includes('n-ask')) { S.notes.push('n-ask'); save(); } openPanel('final'); });
  } else {
    const finishedRole = firstTime && S.tRole === S.role && roleComplete(S.role);
    afterClose = () => say(finishedRole ? [...tk.thanks, [ROLES[S.role].short, '這個角色的工作都完成了！回理事長室報告吧。']] : tk.thanks);
  }
  openPanel('result');
}

const TERM_ALIAS = [['單位補充保費', 3], ['雇主額外負擔', 3], ['投保金額', 1], ['扣費義務人', 2], ['正差額', 4], ['兼職薪資', 6], ['薪資所得', 5], ['執行業務', 7], ['講演', 8], ['稿費', 8], ['租金', 9], ['單次給付', 10], ['購買服務', 11], ['免扣', 12], ['所得稅', 13], ['次月底', 14], ['扣費明細', 15], ['基本工資', 16]];
const TERM_RE = new RegExp(TERM_ALIAS.map(a => a[0]).join('|'), 'g');
function termify(h, used) {
  return h.replace(TERM_RE, m => { const i = TERM_ALIAS.find(a => a[0] === m)[1]; if (used.has(i)) return m; used.add(i); return `<button type="button" class="term" data-act="term" data-term="${i}" aria-haspopup="dialog">${m}</button>`; });
}
const tpop = document.getElementById('tpop');
function showTerm(b) {
  const i = +b.dataset.term, [t, d] = GLOSSARY[i];
  document.querySelectorAll('.term.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
  document.getElementById('tpT').textContent = t; document.getElementById('tpD').textContent = d;
  tpop.hidden = false;
  const r = b.getBoundingClientRect(), w = tpop.offsetWidth, h = tpop.offsetHeight;
  let x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)), y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
  tpop.style.left = x + 'px'; tpop.style.top = y + 'px';
  tpopAt = performance.now();
  if (!S.terms.includes(i)) { S.terms.push(i); save(); }
  SFX.play('open');
}
function hideTerm() { if (!tpop.hidden) { tpop.hidden = true; document.querySelectorAll('.term.on').forEach(x => x.classList.remove('on')); } }
document.getElementById('tpX').addEventListener('click', hideTerm);
document.addEventListener('pointerdown', e => { if (!tpop.hidden && !e.target.closest('#tpop') && !e.target.closest('.term')) hideTerm(); }, true);
let tpopAt = 0;
panel.addEventListener('scroll', () => { if (innerWidth > 640 && performance.now() - tpopAt > 400) hideTerm(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !tpop.hidden) { hideTerm(); e.stopImmediatePropagation(); } }, true);

}

const ents = {};
function el(tag, cls, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; return e; }
function buildScene() {
  plane.innerHTML = '';
  const orig = MAP.slice();

    const lobby = y >= 11;

let ringEl = null;
const labelEls = {};
const OBJ_LABELS = [
  { id: 'board', text: '速查表・流程圖', tx: 7, ty: 5, cx: 448, fy: 295, h: 74 },
  { id: 'shelf', text: '名詞小辭典', tx: 5, ty: 6, cx: 352, fy: 346, h: 122 },
  { id: 'cabinet', text: '範例單據', tx: 17, ty: 6, cx: 1120, fy: 354, h: 110 },
  { id: 'notice', text: '工作清單', tx: 12, ty: 5, cx: 800, fy: 296, h: 64 },
  { id: 'desk', text: '前輩筆記本', tx: 2, ty: 7, cx: 192, fy: 436, h: 58 }
];
function placeEnt(e, fx, fy, viewName, frame, name, isPlayer, marked, hidden) {
  if (hidden) { e.b.style.display = 'none'; e.shadow.style.display = 'none'; return; }
  e.b.style.display = ''; e.shadow.style.display = '';
  if (!isPlayer && e.b.dataset.tx !== String(fx)) { e.b.dataset.tx = fx; e.b.dataset.ty = fy; }
  const key = viewName + frame;
  if (e.key !== key) { e.img.src = spriteURL(e.sid, viewName, frame); e.key = key; }
  if (e.tag.textContent !== name) e.tag.textContent = name;
  e.tagw.classList.toggle('me', !!isPlayer);
  e.mark.style.display = marked ? '' : 'none';
  const bob = frame ? -2 : 0;
  e.b.style.left = (fx * TP + TP / 2 - SPR_W / 2) + 'px';
  e.b.style.top = (fy * TP - SPR_H + 4) + 'px';
  e.b.style.transform = `rotateX(${-TILT}deg) translateY(${bob}px)`;
  e.shadow.style.left = (fx * TP + TP / 2 - 24) + 'px';

}
function applyScale() {
  plane.style.setProperty('--inv', ((view.s < 0.8 ? 0.82 : 1) / view.s).toFixed(3));
  scene.style.perspective = Math.round(1500 * view.s) + 'px';

function fit() {
  const w = scene.clientWidth, h = scene.clientHeight;

  view.w = w; view.h = h;
  const floorEl = plane.querySelector('.floor'), wallEl = plane.querySelector('.wall');
  view.s = 1; applyScale(); setPlane(PLANE_W / 2, PLANE_H / 2);
  const f = floorEl.getBoundingClientRect(), wl = wallEl.getBoundingClientRect();
  const W1 = f.width || PLANE_W, H1 = (f.bottom - wl.top) || 800;
  const portrait = h > w * 1.15;
  let s = portrait ? 0.74 * h / H1 : Math.max(w / W1, h / H1);
  s = Math.max(0.42, Math.min(portrait ? 0.86 : 1.35, s));

}

/* ===== 名牌、邊緣提示 ===== */

  const R = view.w < 760 ? 2 : 3, speaker = dlg ? dlg.lines[dlg.i][0] : null;
  const shown = [];
  NPCS.forEach(n => {
    const e = ents[n.id]; if (n.role === S.role) return;

function frame(now) {
