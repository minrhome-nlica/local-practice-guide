name: Deploy Local Practice Guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python for font optimization
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare licensed GenSen Rounded webfonts
        run: |
          python -m pip install --disable-pip-version-check 'fonttools[woff]'
          python scripts/build_webfonts.py
      - name: Build and upload Astro site
        uses: withastro/action@v6
        env:
          GUIDE_CUSTOM_DOMAIN: ${{ vars.GUIDE_CUSTOM_DOMAIN }}
          PUBLIC_FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        with:
          node-version: 24
          package-manager: npm
          cache: 'false'
      - name: Verify feedback widgets in built pages
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          api = os.getenv('PUBLIC_FEEDBACK_API_URL', '')
          sitekey = os.getenv('PUBLIC_TURNSTILE_SITE_KEY', '')
          if not api or not sitekey:
              raise SystemExit('Missing feedback deployment variables.')
          html = Path('dist/entries/income-withholding/index.html').read_text()
          feed = Path('dist/feedback/index.html').read_text()
          required = ['id="guide-feedback"', 'data-api=', 'data-sitekey=', 'guide-feedback-select', '/scripts/feedback.js']
          for token in required:
              if token not in html:
                  raise SystemExit('Feedback widget missing from article: ' + token)
          if 'id="guide-feedback-feed"' not in feed:
              raise SystemExit('Feedback index widget missing.')
          print('Feedback widget, script URL and public index verified in generated HTML.')
          PY
      - name: Check feedback scripts and D1 schema
        run: |
          node --check services/feedback-worker/src/index.js
          node --check public/scripts/feedback.js
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("services/feedback-worker/schema.sql").read_text())
          assert connection.execute("SELECT count(*) FROM feedback").fetchone()[0] == 0
          print("Feedback API and D1 schema validated.")
          PY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish site
        uses: actions/deploy-pages@v5