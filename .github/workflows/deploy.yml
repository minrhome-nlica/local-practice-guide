name: Deploy Local Practice Guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python for font optimization
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare licensed GenSen Rounded webfonts
        run: |
          python -m pip install --disable-pip-version-check 'fonttools[woff]'
          python scripts/build_webfonts.py
      - name: Build and upload Astro site
        uses: withastro/action@v6
        env:
          GUIDE_CUSTOM_DOMAIN: ${{ vars.GUIDE_CUSTOM_DOMAIN }}
          PUBLIC_FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        with:
          node-version: 24
          package-manager: npm
          cache: 'false'
      - name: Verify feedback widgets in built pages
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          api = os.getenv('PUBLIC_FEEDBACK_API_URL', '')
          sitekey = os.getenv('PUBLIC_TURNSTILE_SITE_KEY', '')
          if not api or not sitekey:
              raise SystemExit('Missing feedback deployment variables.')
          html = Path('dist/entries/income-withholding/index.html').read_text()
          feed = Path('dist/feedback/index.html').read_text()
          required = ['id="guide-feedback"', 'data-api=', 'data-sitekey=', 'guide-feedback-select', '/scripts/feedback.js']
          for token in required:
              if token not in html:
                  raise SystemExit('Feedback widget missing from article: ' + token)
          if 'id="guide-feedback-feed"' not in feed:
              raise SystemExit('Feedback index widget missing.')
          print('Feedback widget, script URL and public index verified in generated HTML.')
          PY
      - name: Verify admin moderation page in built output
        env:
          PUBLIC_FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
        run: |
          node --check public/scripts/feedback-admin.js
          python - <<'PY'
          from pathlib import Path
          import os
          page = Path('dist/admin/feedback/index.html').read_text()
          if not os.getenv('PUBLIC_FEEDBACK_API_URL'):
              raise SystemExit('FEEDBACK_API_URL not configured for admin moderation')
          for key in ['id="guide-feedback-admin"', 'id="staff-login"', 'id="staff-dashboard"', '/scripts/feedback-admin.js', 'noindex,nofollow,noarchive']:
              if key not in page:
                  raise SystemExit('Admin moderation page is missing: ' + key)
          print('Admin moderation page built and checked without embedded credentials.')
          PY
      - name: Verify grouped reader notes and formatted calculator
        run: |
          node --check public/scripts/nhi-calculator.js
          python - <<'PY'
          from pathlib import Path
          note = Path('dist/entries/income-withholding/index.html').read_text()
          feed = Path('dist/feedback/index.html').read_text()
          calc = Path('dist/tools/nhi-calculator/index.html').read_text()
          for token in ['guide-feedback-notes-dialog', 'data-feedback-paragraph-notes']:
              assert token in note, token
          for kind in ['supplement', 'question', 'correction']:
              assert f'data-feedback-kind="{kind}"' in feed, kind
          assert '單位<strong>每月所有薪資</strong>的差額' in calc
          assert calc.count('data-money-input') == 5, 'expected five money fields'
          assert 'type="number"' not in calc, 'unformatted numeric field in calculator'
          print('Comment grouping UI, three category columns, and calculator fields verified.')
          PY
      - name: Verify mobile reading layout guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('src/styles/global.css').read_text()
          notes = Path('src/styles/feedback.css').read_text()
          for token in ['.hero-grid .hero-art{', 'margin:20px auto 0', 'grid-column:1/-1;grid-row:2', 'max-width:650px', 'prefers-reduced-motion']:
              assert token in css, token
          section = notes.split('.guide-article .guide-annotated-paragraph{',1)[1].split('}',1)[0]
          assert 'background:' not in section
          assert 'border-left:' not in section
          assert 'padding-left:' not in section
          assert 'guide-annotation-marker' in notes
          homepage=Path('dist/index.html').read_text()
          assert '常用主題：' in homepage
          assert '搜尋補助、經費編列、核銷' in homepage
          print('Responsive hero and marker-only annotation guardrails validated.')
          PY
      - name: Audit all generated pages, downloads and image assets
        run: python3 scripts/audit_published_site.py
      - name: Check knowledge article relationships and tool links
        run: node scripts/check-entry-links.mjs
      - name: Check feedback scripts and D1 schema
        run: |
          node --check services/feedback-worker/src/index.js
          node --check public/scripts/feedback.js
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("services/feedback-worker/schema.sql").read_text())
          assert connection.execute("SELECT count(*) FROM feedback").fetchone()[0] == 0
          print("Feedback API and D1 schema validated.")
          PY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish site
        uses: actions/deploy-pages@v5