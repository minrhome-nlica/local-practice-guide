name: Deploy Local Practice Guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python for font optimization
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare licensed GenSen Rounded webfonts
        run: |
          python -m pip install --disable-pip-version-check 'fonttools[woff]'
          python scripts/build_webfonts.py
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          cache: 'false'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish site
        uses: actions/deploy-pages@v5