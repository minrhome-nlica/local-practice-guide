# Worker-specific config. No credentials, only public resource identifiers.
# Analytics token MUST be added as secret CLOUDFLARE_ANALYTICS_TOKEN in Worker Settings.
# This must be deployed to the Access-protected guide-admin-console Worker.
name = "guide-admin-console"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true
preview_urls = false

[vars]
SITE_URL = "https://guide.mountcounty.com"
CLOUDFLARE_ACCOUNT_ID = "38bda38ac85e2040c2bd4da34fefd29b"
# This is the public beacon siteToken (not the GraphQL siteTag).
WEB_ANALYTICS_SITE_TOKEN = "b4d574a93baa4b5f9d7dc7fc504e19db"
# Optional manual override: WEB_ANALYTICS_SITE_TAG must come from Cloudflare site info, NOT from the beacon token.
ACCESS_AUD = "4c23b434eb9c26431458cc9cff097fa0f7117089c8d4d4d77a418bc519de4aad"

[[d1_databases]]
binding = "DB"
database_name = "guide-feedback"
database_id = "6fd22049-0d1a-4062-b843-67b6d5e3e0e7"
